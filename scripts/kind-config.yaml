kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Traefik NodePort (see gitops/addons/traefik/values-kind.yaml) -> localhost:8080
      - containerPort: 30080
        hostPort: __HTTP_PORT__
        protocol: TCP
  - role: worker
  - role: worker
