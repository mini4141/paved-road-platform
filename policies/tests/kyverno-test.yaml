apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: paved-road-guardrails
policies:
  - ../base/require-requests-limits.yaml
  - ../base/require-team-label.yaml
  - ../base/disallow-latest-tag.yaml
resources:
  - good-pod.yaml
  - bad-pod.yaml
results:
  - { policy: require-requests-limits, isValidatingPolicy: true, resources: [good-app], kind: Pod, result: pass }
  - { policy: require-requests-limits, isValidatingPolicy: true, resources: [bad-app], kind: Pod, result: fail }
  - { policy: require-team-label, isValidatingPolicy: true, resources: [good-app], kind: Pod, result: pass }
  - { policy: require-team-label, isValidatingPolicy: true, resources: [bad-app], kind: Pod, result: fail }
  - { policy: disallow-latest-tag, isValidatingPolicy: true, resources: [good-app], kind: Pod, result: pass }
  - { policy: disallow-latest-tag, isValidatingPolicy: true, resources: [bad-app], kind: Pod, result: fail }
