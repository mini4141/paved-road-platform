apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-app
  namespace: guardrail-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: good-app }
  template:
    metadata:
      labels: { app: good-app, team: platform }
    spec:
      containers:
        - name: app
          image: nginx:1.27
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
