# Deliberately violates all three policies: no team label, no requests/limits, :latest tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-app
  namespace: guardrail-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: bad-app }
  template:
    metadata:
      labels: { app: bad-app }
    spec:
      containers:
        - name: app
          image: nginx:latest
