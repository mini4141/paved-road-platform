name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: go, dir: portal, image: portal }
          - { language: go, dir: templates/go-http-service, image: go-http-service }
          - { language: node, dir: templates/node-http-service, image: node-http-service }
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      language: ${{ matrix.language }}
      working-directory: ${{ matrix.dir }}
      image-name: ${{ matrix.image }}

  image-scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: portal, image: portal }
          - { dir: templates/go-http-service, image: go-http-service }
          - { dir: templates/node-http-service, image: node-http-service }
    uses: ./.github/workflows/reusable-image-scan.yml
    with:
      context: ${{ matrix.dir }}
      image-name: ${{ matrix.image }}

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - uses: terraform-linters/setup-tflint@v4
      - name: terraform fmt, validate, tflint
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          (cd envs/showcase && terraform init -backend=false -input=false && terraform validate)
          tflint --recursive --config "$PWD/.tflint.hcl"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Install kubeconform and the Kyverno CLI
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
          curl -fsSL https://github.com/kyverno/kyverno/releases/download/v1.20.0/kyverno-cli_v1.20.0_linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin kyverno
      - name: Add Helm repositories
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo add opencost https://opencost.github.io/opencost-helm-chart
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
      - name: kubeconform on rendered Helm and Kustomize
        run: scripts/kubeconform.sh
      - name: Kyverno policy tests
        run: kyverno test policies
