apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
  labels: {{- include "portal.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portal
  labels: {{- include "portal.labels" . | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, create, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portal
  labels: {{- include "portal.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: portal }
subjects:
  - { kind: ServiceAccount, name: portal, namespace: {{ .Release.Namespace }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels: {{- include "portal.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: portal }
  template:
    metadata:
      labels: {{- include "portal.labels" . | nindent 8 }}
    spec:
      serviceAccountName: portal
      containers:
        - name: portal
          image: {{ if .Values.paved.registry }}{{ .Values.paved.registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: GIT_REPO_URL, value: {{ .Values.gitRepoURL | quote }} }
            - { name: GIT_REVISION, value: {{ .Values.gitRevision | quote }} }
            - { name: ARGOCD_NAMESPACE, value: {{ .Values.argocdNamespace | quote }} }
            - { name: OPENCOST_URL, value: {{ .Values.opencostURL | quote }} }
            - { name: IMAGE_REGISTRY, value: {{ .Values.paved.registry | quote }} }
            - { name: IMAGE_TAG, value: {{ .Values.image.tag | quote }} }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  labels: {{- include "portal.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: portal }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portal
  labels: {{- include "portal.labels" . | nindent 4 }}
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services: [{ name: portal, port: 80 }]
