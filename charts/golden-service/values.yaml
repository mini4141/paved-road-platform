# Name of the service; also used for the namespace, Service and URL prefix /svc/<name>.
nameOverride: ""
team: platform
image:
  repository: go-http-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent
replicas: 2
containerPort: 8080
resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { cpu: 500m, memory: 128Mi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
pdb:
  enabled: true
  minAvailable: 1
otel:
  endpoint: http://otel-collector.observability.svc:4318
serviceMonitor:
  enabled: true
  interval: 15s
ingress:
  enabled: true
  entryPoints: [web]
