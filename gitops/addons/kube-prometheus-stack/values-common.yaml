fullnameOverride: kps
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false }
prometheusOperator:
  admissionWebhooks: { enabled: false }
  tls: { enabled: false }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 192Mi }
prometheus:
  prometheusSpec:
    retention: 24h
    scrapeInterval: 15s
    enableFeatures: [exemplar-storage]
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 700Mi }
      limits: { memory: 1500Mi }
alertmanager:
  alertmanagerSpec:
    retention: 24h
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 128Mi }
  config:
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      routes:
        - receiver: "null"
          matchers: [alertname = "Watchdog"]
        - receiver: portal-webhook
          matchers: [alertname = "GoldenServiceHighErrorRate"]
          group_wait: 10s
    receivers:
      - name: "null"
      - name: portal-webhook
        webhook_configs:
          - url: http://portal.paved-road.svc/alerts
            send_resolved: true
kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }
prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }
grafana:
  fullnameOverride: kps-grafana
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: utc
  ingress: { enabled: false } # routed by the IngressRoute in charts/platform-observability
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
    auth.anonymous:
      enabled: true
      org_role: Viewer
    analytics:
      reporting_enabled: false
      check_for_updates: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      defaultDatasourceEnabled: true
      uid: prometheus
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc:3100
      jsonData:
        derivedFields:
          - name: trace_id
            matcherRegex: '"trace_id":"(\w+)"'
            url: "$${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          filterByTraceID: false
          customQuery: true
          query: '{namespace=~".+"} |= "$${__trace.traceId}"'
        serviceMap:
          datasourceUid: prometheus
