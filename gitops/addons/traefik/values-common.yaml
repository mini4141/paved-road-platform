global:
  checkNewVersion: false
  sendAnonymousUsage: false
ingressRoute:
  dashboard:
    enabled: false
ports:
  websecure:
    expose:
      default: false
accessLog:
  enabled: true
  format: json
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 160Mi }
providers:
  kubernetesIngress:
    publishedService:
      enabled: false
