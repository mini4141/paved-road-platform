admissionController:
  replicas: 1
  container:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
backgroundController:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
reportsController:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
cleanupController:
  enabled: false
# No legacy kyverno.io policies exist here; skip the pre-install hook Job (Argo waits on its hook lifecycle).
upgrade:
  acknowledgeLegacyPoliciesNotEnforced: true
  legacyPolicyCheck:
    enabled: false
